<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>COMSTAR Kiosk</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0b0f14;
        color: #e8eef5;
      }
      main {
        text-align: center;
        padding: 2rem;
      }
      .status {
        font-size: 1.25rem;
        margin-top: 1rem;
      }
      .status[data-state="connected"] {
        color: #6ee7a8;
      }
      .status[data-state="connecting"] {
        color: #fbbf24;
      }
      .status[data-state="disconnected"] {
        color: #f87171;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>COMSTAR</h1>
      <p class="status" id="connection-status" data-state="connecting">Connecting…</p>
      <p id="avatar-status">Avatar: loading</p>
    </main>
    <script type="module">
      import { BridgeClient } from './bridge_client.js';
      import { Avatar } from './avatar.js';

      const statusEl = document.getElementById('connection-status');
      const avatarStatusEl = document.getElementById('avatar-status');
      const params = new URLSearchParams(window.location.search);
      const bridgeUrl = params.get('bridge') ?? 'ws://127.0.0.1:8777/kiosk';

      const avatar = new Avatar({
        onSpeakStarted: () => bridge.send('speak.started'),
        onSpeakEnded: () => bridge.send('speak.ended'),
      });

      const bridge = new BridgeClient(bridgeUrl, {
        onStateChange: (state) => {
          statusEl.dataset.state = state;
          statusEl.textContent =
            state === 'connected'
              ? 'Connected to bridge'
              : state === 'connecting'
                ? 'Connecting…'
                : 'Disconnected — reconnecting';
        },
        onEnvelope: (envelope) => avatar.handle(envelope),
        onOpen: () => {
          bridge.send('ready', {
            avatarLoaded: false,
            webglVendor: 'stub',
            fps: 0,
          });
          avatarStatusEl.textContent = 'Avatar: stub (M1)';
        },
      });

      bridge.connect();
    </script>
  </body>
</html>
