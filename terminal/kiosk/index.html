<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>COMSTAR</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #060d16;
    overflow: hidden;
    cursor: none !important;
    display: flex;
    flex-direction: column;
  }
  *, *::before, *::after { cursor: none !important; }
  #stage {
    position: relative;
    flex: 1 1 auto;
    width: 100%;
    min-height: 0;
    z-index: 1;
    /* Fallback wash if avatar.js has not painted yet. */
    background:
      radial-gradient(ellipse 80% 55% at 50% 48%, rgba(61, 220, 255, 0.08), transparent 72%),
      #060d16;
  }
  /* CSS stand-in so a failed/slow SVG mount is never a pure black panel. */
  #stage:not(.has-avatar)::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: min(55vmin, 280px);
    height: min(55vmin, 280px);
    transform: translate(-50%, -50%);
    border-radius: 50%;
    border: 3px solid rgba(61, 220, 255, 0.55);
    box-shadow:
      0 0 40px rgba(61, 220, 255, 0.25),
      inset 0 0 30px rgba(61, 220, 255, 0.12);
    animation: stagePulse 2.4s ease-in-out infinite;
    pointer-events: none;
  }
  #stage:not(.has-avatar)::before {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: 12px;
    height: 12px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: #F0A202;
    box-shadow: 0 0 16px rgba(240, 162, 2, 0.7);
    pointer-events: none;
    z-index: 2;
  }
  @keyframes stagePulse {
    0%, 100% { opacity: 0.55; transform: translate(-50%, -50%) scale(0.96); }
    50% { opacity: 1; transform: translate(-50%, -50%) scale(1.04); }
  }
  #status {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 5.75rem;
    padding: 10px 16px;
    font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #7fc4ff;
    opacity: .55;
    white-space: pre;
    pointer-events: none;
    display: none;
    z-index: 20;
  }
  #status.on { display: block; }
  #phase {
    position: fixed;
    top: 0.75rem;
    left: 0.75rem;
    z-index: 20;
    pointer-events: none;
    text-align: left;
    max-width: min(48vw, 18rem);
    font-family: "Segoe UI", "Helvetica Neue", system-ui, sans-serif;
  }
  #chat {
    position: relative;
    flex: 0 0 5.75rem;
    z-index: 20;
    width: 100%;
    height: 5.75rem;
    padding: 0.45rem 0.85rem 0.55rem;
    box-sizing: border-box;
    pointer-events: none;
    background: #0a1420;
    border-top: 1px solid rgba(127, 196, 255, 0.28);
    box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.45);
    font-family: "Segoe UI", "Helvetica Neue", system-ui, sans-serif;
  }
  #chat-log {
    height: 100%;
    overflow-y: auto;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    gap: 0.2rem;
    scrollbar-width: none;
  }
  #chat-log:empty::after {
    content: "Conversation will appear here";
    display: block;
    text-align: center;
    font-size: 0.75rem;
    letter-spacing: 0.04em;
    color: rgba(140, 190, 230, 0.45);
    padding-top: 1.4rem;
  }
  #chat-log::-webkit-scrollbar { display: none; }
  .chat-line {
    display: flex;
    flex-direction: row;
    align-items: baseline;
    gap: 0.45rem;
    max-width: 100%;
    animation: chat-in 0.22s ease-out;
  }
  .chat-line.you { align-self: stretch; justify-content: flex-end; text-align: right; }
  .chat-line.comstar { align-self: stretch; justify-content: flex-start; text-align: left; }
  .chat-line.sys { align-self: stretch; justify-content: center; text-align: center; opacity: 0.75; }
  .chat-line.you .chat-who { order: 2; }
  .chat-line.you .chat-text { order: 1; }
  .chat-who {
    flex: none;
    font-size: 0.62rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: rgba(140, 190, 230, 0.65);
  }
  .chat-line.you .chat-who { color: rgba(140, 220, 170, 0.7); }
  .chat-text {
    font-size: clamp(0.78rem, 2.2vw, 0.95rem);
    line-height: 1.3;
    color: rgba(220, 232, 245, 0.92);
  }
  .chat-line.sys .chat-text {
    font-size: 0.72rem;
    color: rgba(255, 180, 160, 0.9);
  }
  @keyframes chat-in {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  #phase .label {
    display: inline-block;
    padding: 0.4rem 0.85rem;
    border-radius: 999px;
    font-size: clamp(0.82rem, 2.4vw, 1rem);
    font-weight: 650;
    letter-spacing: 0.04em;
    color: #e8f4ff;
    background: rgba(8, 18, 32, 0.92);
    border: 1px solid rgba(127, 196, 255, 0.4);
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.45);
    transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease, opacity 0.2s ease;
  }
  #phase .detail {
    margin-top: 0.3rem;
    font-size: clamp(0.72rem, 2vw, 0.88rem);
    line-height: 1.3;
    color: rgba(200, 225, 245, 0.9);
    text-shadow: 0 1px 6px rgba(0, 0, 0, 0.7);
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  /* Always visible — idle/sleep are dim, active phases are bright. */
  #phase[data-phase="idle"],
  #phase[data-phase="sleeping"] { opacity: 0.72; }
  #phase:not([data-phase="idle"]):not([data-phase="sleeping"]) { opacity: 1; }
  #phase[data-phase="sleeping"] .label {
    border-color: rgba(127, 196, 255, 0.28);
    background: rgba(8, 18, 32, 0.78);
    color: rgba(200, 220, 240, 0.85);
  }
  #phase[data-phase="noticed"] .label {
    border-color: rgba(180, 200, 255, 0.65);
    background: rgba(20, 28, 48, 0.92);
  }
  #phase[data-phase="engaged"] .label {
    border-color: rgba(127, 196, 255, 0.55);
    background: rgba(12, 28, 44, 0.92);
  }
  #phase[data-phase="listening"] .label {
    border-color: rgba(80, 210, 255, 0.7);
    background: rgba(10, 40, 60, 0.92);
    animation: phase-pulse 1.4s ease-in-out infinite;
  }
  #phase[data-phase="heard"] .label {
    border-color: rgba(90, 220, 140, 0.75);
    background: rgba(12, 48, 28, 0.92);
    color: #d8ffe8;
  }
  #phase[data-phase="thinking"] .label {
    border-color: rgba(255, 190, 90, 0.75);
    background: rgba(48, 32, 8, 0.92);
    color: #ffe8c0;
    animation: phase-pulse 0.9s ease-in-out infinite;
  }
  #phase[data-phase="speaking"] .label {
    border-color: rgba(200, 220, 255, 0.8);
    background: rgba(20, 32, 56, 0.94);
  }
  #phase[data-phase="missed"] .label {
    border-color: rgba(255, 140, 120, 0.75);
    background: rgba(48, 16, 12, 0.92);
    color: #ffd8d0;
  }
  #pairing {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 40;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 1rem;
    background: rgba(6, 13, 22, 0.82);
    pointer-events: none;
  }
  #pairing.on { display: flex; }
  #pairing-qr {
    width: min(42vw, 14rem);
    height: min(42vw, 14rem);
    background: #f5f7fa;
    border-radius: 0.5rem;
    padding: 0.65rem;
    box-sizing: border-box;
  }
  #pairing-qr svg { width: 100%; height: 100%; display: block; }
  #pairing-code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: clamp(1.1rem, 4vw, 1.6rem);
    letter-spacing: 0.18em;
    color: #e8f1ff;
  }
  #pairing-hint {
    font-size: 0.85rem;
    color: rgba(180, 210, 240, 0.85);
  }
  #admin-qr {
    display: none;
    position: fixed;
    top: 4.1rem;
    right: 0.65rem;
    z-index: 25;
    width: 5.5rem;
    padding: 0.35rem;
    border-radius: 0.4rem;
    background: rgba(8, 18, 32, 0.88);
    border: 1px solid rgba(127, 196, 255, 0.35);
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.45);
    pointer-events: none;
    text-align: center;
  }
  #admin-qr.on { display: block; }
  #admin-qr-svg {
    width: 100%;
    aspect-ratio: 1;
    background: #f5f7fa;
    border-radius: 0.25rem;
    overflow: hidden;
  }
  #admin-qr-svg svg { width: 100%; height: 100%; display: block; }
  #admin-qr-label {
    margin-top: 0.25rem;
    font: 500 0.55rem/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: 0.02em;
    color: rgba(180, 210, 240, 0.85);
    word-break: break-all;
  }
  @keyframes phase-pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.03); opacity: 0.88; }
  }
  #fault {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 6.4rem;
    text-align: center;
    font: 14px/1.5 system-ui, sans-serif;
    color: #7fc4ff;
    opacity: .7;
    display: none;
    z-index: 20;
  }
  .health {
    position: fixed;
    top: 0.75rem;
    right: 0.75rem;
    width: 140px;
    height: 48px;
    z-index: 20;
    pointer-events: none;
    opacity: 0.9;
  }
  .health canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
</style>
<script src="./health_chart.js"></script>
</head>
<body>
<div id="stage"></div>
<div class="health" aria-hidden="true">
  <canvas id="health-chart" width="140" height="48"></canvas>
</div>
<div id="phase" data-phase="idle" aria-live="polite">
  <div class="label">Ready</div>
  <div class="detail"></div>
</div>
<div id="pairing" aria-live="polite">
  <div id="pairing-qr"></div>
  <div id="pairing-code"></div>
  <div id="pairing-hint">Scan or enter the code on your phone</div>
</div>
<div id="admin-qr" aria-hidden="true">
  <div id="admin-qr-svg"></div>
  <div id="admin-qr-label"></div>
</div>
<div id="chat" aria-live="polite">
  <div id="chat-log"></div>
</div>
<div id="status"></div>
<div id="fault"></div>

<script type="module">
import { BridgeClient } from './bridge_client.js';

const params = new URLSearchParams(location.search);
const bridgeUrl = params.get('bridge') || 'ws://127.0.0.1:8777/kiosk';
const demo = params.has('demo') || params.has('debug');
const debugUi = demo;

const statusEl = document.getElementById('status');
const faultEl = document.getElementById('fault');
const phaseEl = document.getElementById('phase');
const phaseLabel = phaseEl.querySelector('.label');
const phaseDetail = phaseEl.querySelector('.detail');
const adminQrEl = document.getElementById('admin-qr');
const adminQrSvg = document.getElementById('admin-qr-svg');
const adminQrLabel = document.getElementById('admin-qr-label');
if (demo) statusEl.classList.add('on');

function setAdminQr(d) {
  if (!adminQrEl) return;
  if (!d || !d.active || !d.qrSvg) {
    adminQrEl.classList.remove('on');
    adminQrEl.setAttribute('aria-hidden', 'true');
    if (adminQrSvg) adminQrSvg.innerHTML = '';
    if (adminQrLabel) adminQrLabel.textContent = '';
    return;
  }
  if (adminQrSvg) adminQrSvg.innerHTML = d.qrSvg;
  if (adminQrLabel) {
    const bits = [d.ip, d.iface].filter(Boolean);
    adminQrLabel.textContent = bits.length ? bits.join(' · ') : 'admin';
  }
  adminQrEl.classList.add('on');
  adminQrEl.setAttribute('aria-hidden', 'false');
}

const PHASE_LABELS = {
  idle: 'Ready',
  sleeping: 'Sleeping',
  noticed: 'I see you',
  engaged: 'Hi',
  listening: 'Listening',
  heard: 'Heard you',
  thinking: 'Thinking',
  speaking: 'Speaking',
  missed: 'Missed that',
};

let phaseClearTimer = null;
function setPhase(phase, detail = '') {
  const key = PHASE_LABELS[phase] ? phase : 'idle';
  phaseEl.dataset.phase = key;
  phaseLabel.textContent = PHASE_LABELS[key];
  phaseDetail.textContent = detail || '';
  if (phaseClearTimer) clearTimeout(phaseClearTimer);
  phaseClearTimer = null;
  if (key === 'missed') {
    phaseClearTimer = setTimeout(() => {
      if (phaseEl.dataset.phase === 'missed') setPhase('listening', 'Listening…');
    }, 2500);
  }
}

const chatLog = document.getElementById('chat-log');
const MAX_CHAT_LINES = 40;
function appendChat(role, text) {
  const t = (text || '').trim();
  if (!t) return;
  const line = document.createElement('div');
  line.className = `chat-line ${role}`;
  const who = document.createElement('div');
  who.className = 'chat-who';
  who.textContent = role === 'you' ? 'You' : role === 'comstar' ? 'COMSTAR' : '';
  const body = document.createElement('div');
  body.className = 'chat-text';
  body.textContent = t;
  if (role !== 'sys') line.appendChild(who);
  line.appendChild(body);
  chatLog.appendChild(line);
  while (chatLog.children.length > MAX_CHAT_LINES) {
    chatLog.removeChild(chatLog.firstChild);
  }
  chatLog.scrollTop = chatLog.scrollHeight;
}

function fault(msg) {
  faultEl.textContent = msg;
  faultEl.style.display = 'block';
  setTimeout(() => {
    faultEl.style.display = 'none';
  }, 6000);
}

const healthChart =
  typeof ComstarHealthChart === 'function'
    ? new ComstarHealthChart(document.getElementById('health-chart'), {
        maxPoints: 60,
      })
    : null;

let speakStart = 0;
/** @type {import('./avatar.js').ComstarAvatar | null} */
let avatar = null;
/** @type {BridgeClient} */
let bridge;

function sendReady() {
  if (!bridge?.ws || bridge.ws.readyState !== WebSocket.OPEN) return;
  const s = avatar ? avatar.stats() : { webglVendor: null, fps: 0 };
  bridge.send('ready', {
    avatarLoaded: !!avatar,
    webglVendor: s.webglVendor,
    fps: s.fps,
    debugUi,
  });
}

// Open the bridge WebSocket *before* mounting the SVG avatar. On Pi Chromium /
// VideoCore, constructing the emblem first can starve the event loop so the
// WS handshake never completes (kiosk_connected stays false, blank panel).
// Use `let` + deferred ready: loopback WS may fire `open` synchronously during
// `new BridgeClient()`, when a `const bridge =` binding is still in TDZ.
bridge = new BridgeClient(bridgeUrl, {
  onOpen() {
    setTimeout(sendReady, 0);
  },

  config(d) {
    if (d.mood && avatar) avatar.setState(d.mood);
    // Bridge COMSTAR_ENV=dev → show process HUD + accept admin QR without ?demo.
    if (d.debugUi) {
      statusEl.classList.add('on');
    }
  },

  'admin.qr'(d) {
    setAdminQr(d);
  },

  'avatar.options'(d) {
    if (!avatar) return;
    const applied = avatar.setOptions({
      bloom: d.bloom,
      fps: d.fps ?? d.maxFps,
      scale: d.scale ?? d.emblemScale,
      emblem: d.emblem,
      fitMaxPx: d.fitMaxPx ?? d.maxSize,
      fitFill: d.fitFill,
    });
    if (d.mood) avatar.setState(d.mood);
    console.info('[avatar] options', applied);
    if (demo && statusEl) {
      const s = avatar.stats();
      statusEl.textContent =
        `state ${avatar.state}  fps ${s.fps}  ` +
        `gaze ${avatar.gaze.x.toFixed(2)}  amp ${avatar.amplitude.toFixed(2)}  ` +
        `scale ${avatar.emblemScale}  fit ${avatar.fitMaxPx}  bloom ${avatar.bloom}`;
    }
  },

  state(d) {
    if (!avatar) return;
    avatar.setState(d.state);
    if (d.gaze) avatar.setGaze(d.gaze.x, d.gaze.y || 0);
    // Fallback if a phase envelope was missed: keep HUD in sync with state.
    if (d.state === 'noticed') setPhase('noticed', 'I see you…');
    if (d.state === 'listening') setPhase('listening', 'Listening…');
    if (d.state === 'ambient') setPhase('idle');
    if (d.state === 'sleeping') setPhase('sleeping', 'Sleeping…');
    if (d.state === 'engaged' && phaseEl.dataset.phase === 'idle') {
      setPhase('engaged', d.userid || d.displayName || '');
    }
  },

  speak(d) {
    if (!avatar) return;
    speakStart = performance.now();
    // Sleep acknowledgment stays dim; do not flash "responding" brightness.
    if (d.keepSleeping || avatar.state === 'sleeping') {
      avatar.setState('sleeping');
      setPhase('sleeping', d.text || 'Sleeping…');
    } else if (d.mood && typeof d.mood === 'string') {
      avatar.setState(d.mood);
      setPhase('speaking', d.text || '');
    } else {
      avatar.setState('responding');
      setPhase('speaking', d.text || '');
    }
    if (d.text) appendChat('comstar', d.text);
    avatar.speak(d.audioUrl, { muteOutput: !!d.muteOutput });
  },

  'speak.cancel'() {
    if (!avatar) return;
    avatar.cancelSpeak();
    if (avatar.state === 'sleeping') setPhase('sleeping', 'Sleeping…');
    else setPhase('idle');
  },

  listening(d) {
    if (!avatar) return;
    if (d.active) {
      avatar.setState('listening');
      if (phaseEl.dataset.phase !== 'heard' && phaseEl.dataset.phase !== 'thinking') {
        // Keep bridge-provided detail (e.g. sleep wake verify) when present.
        if (phaseEl.dataset.phase !== 'listening') {
          setPhase('listening', 'Listening…');
        }
      }
    }
    avatar.setMicLevel(d.level ?? 0);
  },

  thinking(d) {
    if (!avatar) return;
    avatar.setThinking(!!d.active);
    if (d.active) setPhase('thinking', 'Talking to AO…');
  },

  'pairing.qr'(d) {
    const el = document.getElementById('pairing');
    const qr = document.getElementById('pairing-qr');
    const code = document.getElementById('pairing-code');
    const hint = document.getElementById('pairing-hint');
    if (!d || !d.active) {
      el.classList.remove('on');
      qr.innerHTML = '';
      code.textContent = '';
      if (hint) hint.textContent = 'Scan or enter the code on your phone';
      return;
    }
    const phase = d.phase || 'awaiting';
    if (phase === 'verifying') {
      qr.innerHTML = '';
      code.textContent = 'Verifying…';
      if (hint) hint.textContent = 'Finishing Google connection';
    } else {
      qr.innerHTML = d.qrSvg || '';
      code.textContent = (d.userCode || '').toUpperCase();
      if (hint) hint.textContent = 'Scan or enter the code on your phone';
    }
    el.classList.add('on');
  },

  phase(d) {
    if (!avatar) return;
    const phase = d.phase || 'idle';
    const detail = d.detail || '';
    setPhase(phase, detail);
    if (phase === 'sleeping') avatar.setState('sleeping');
    if (phase === 'listening') avatar.setState('listening');
    if (phase === 'idle') {
      // Ready after wake-from-sleep — keep bright but not "listening" spin.
      if (avatar.state === 'listening' || avatar.state === 'sleeping') {
        avatar.setState('engaged');
      }
    }
    // Speaking while already Sleeping (sleep ack / greeter race): stay dim.
    if (phase === 'speaking' && avatar.state === 'sleeping') {
      avatar.setState('sleeping');
    }
    if (phase === 'heard' && detail) appendChat('you', detail);
    if (phase === 'missed') appendChat('sys', detail || "Didn't catch that");
  },

  health(d) {
    if (healthChart) healthChart.push(d.cpu, d.mem, d.ts);
  },

  error(d) {
    fault(d.message || 'Something went wrong.');
  },
});

// Yield so the WS handshake can finish before SVG work (VideoCore hangs if
// we mount the emblem in the same turn as open).
await new Promise((r) => setTimeout(r, 0));

try {
  const { ComstarAvatar } = await import('./avatar.js');
  avatar = new ComstarAvatar(document.getElementById('stage'), {
    // Preset: starburst | reactor | sentinel | spectrum | instrument
    emblem: params.get('emblem') || 'starburst',
    // Pi: modest SVG bloom + capped fps. Override: ?bloom=0&fps=12 or COMSTAR_KIOSK_URL.
    emblemScale: parseFloat(params.get('scale') || '0.62'),
    // Cap CSS square so the mark stays ~same size across resolutions; margins grow.
    fitMaxPx: parseFloat(params.get('fitMax') || params.get('maxSize') || '720'),
    fitFill: parseFloat(params.get('fitFill') || '0.92'),
    bloom: parseFloat(params.get('bloom') || '3'),
    maxFps: parseFloat(params.get('fps') || '12'),
    onEvent(type, data) {
      if (type === 'speak.started') {
        bridge.span('avatar_start', performance.now() - speakStart);
        bridge.send('speak.started', {});
        return;
      }
      if (type === 'speak.ended') {
        bridge.send('speak.ended', {});
        return;
      }
      if (type === 'error') {
        bridge.send('error', data);
      }
    },
  });
  document.getElementById('stage')?.classList.add('has-avatar');
  sendReady();
} catch (err) {
  console.error('[avatar] mount failed', err);
  fault('Avatar failed to load');
  bridge.send('error', {
    code: 'avatar_mount_failed',
    message: String(err && err.message ? err.message : err),
  });
}

if (demo) {
  setInterval(() => {
    if (!avatar) return;
    const s = avatar.stats();
    statusEl.textContent =
      `state ${avatar.state}  fps ${s.fps}  ` +
      `gaze ${avatar.gaze.x.toFixed(2)}  amp ${avatar.amplitude.toFixed(2)}  ` +
      `scale ${avatar.emblemScale}  bloom ${avatar.bloom}`;
  }, 250);
}

// Boot beacon so operators can see JS executed.
try {
  fetch('./boot.txt?t=' + Date.now()).catch(() => {});
} catch (_) {}
</script>
</body>
</html>
