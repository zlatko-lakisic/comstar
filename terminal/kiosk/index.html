<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>COMSTAR</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #060d16;
    overflow: hidden;
    cursor: none !important;
  }
  *, *::before, *::after { cursor: none !important; }
  #stage {
    display: block;
    width: 100vw;
    height: 100vh;
  }
  #status {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 10px 16px;
    font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #7fc4ff;
    opacity: .55;
    white-space: pre;
    pointer-events: none;
    display: none;
  }
  #status.on { display: block; }
  #fault {
    position: absolute;
    inset: auto 0 24px;
    text-align: center;
    font: 14px/1.5 system-ui, sans-serif;
    color: #7fc4ff;
    opacity: .7;
    display: none;
  }
  .health {
    position: fixed;
    top: 0.75rem;
    right: 0.75rem;
    width: 140px;
    height: 48px;
    z-index: 5;
    pointer-events: none;
    opacity: 0.9;
  }
  .health canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "./assets/vendor/three.module.js",
    "three/addons/": "./assets/vendor/"
  }
}
</script>
<script src="./health_chart.js"></script>
</head>
<body>
<canvas id="stage"></canvas>
<div class="health" aria-hidden="true">
  <canvas id="health-chart" width="140" height="48"></canvas>
</div>
<div id="status"></div>
<div id="fault"></div>

<script type="module">
import { ComstarAvatar } from './avatar.js';
import { BridgeClient } from './bridge_client.js';

const params = new URLSearchParams(location.search);
const bridgeUrl = params.get('bridge') || 'ws://127.0.0.1:8777/kiosk';
const demo = params.has('demo');

const statusEl = document.getElementById('status');
const faultEl = document.getElementById('fault');
if (demo) statusEl.classList.add('on');

const healthChart =
  typeof ComstarHealthChart === 'function'
    ? new ComstarHealthChart(document.getElementById('health-chart'), {
        maxPoints: 60,
      })
    : null;

let speakStart = 0;

const avatar = new ComstarAvatar(document.getElementById('stage'), {
  onEvent(type, data) {
    if (type === 'head.loaded') return;
    if (type === 'speak.started') {
      bridge.span('avatar_start', performance.now() - speakStart);
      bridge.send('speak.started', {});
      return;
    }
    if (type === 'speak.ended') {
      bridge.send('speak.ended', {});
      return;
    }
    if (type === 'error') {
      bridge.send('error', data);
      if (data.code === 'glb_load_failed') {
        faultEl.textContent = 'Running without the head model.';
        faultEl.style.display = 'block';
        setTimeout(() => {
          faultEl.style.display = 'none';
        }, 6000);
      }
    }
  },
});

const bridge = new BridgeClient(bridgeUrl, {
  onOpen() {
    const s = avatar.stats();
    bridge.send('ready', {
      avatarLoaded: s.headLoaded,
      webglVendor: s.webglVendor,
      fps: s.fps,
    });
  },

  config(d) {
    if (d.mood) avatar.setState(d.mood);
  },

  state(d) {
    avatar.setState(d.state);
    if (d.gaze) avatar.setGaze(d.gaze.x, d.gaze.y || 0);
  },

  speak(d) {
    speakStart = performance.now();
    avatar.setState('responding');
    avatar.speak(d.audioUrl);
  },

  'speak.cancel'() {
    avatar.cancelSpeak();
  },

  listening(d) {
    if (d.active) avatar.setState('listening');
    avatar.setMicLevel(d.level ?? 0);
  },

  thinking(d) {
    avatar.setThinking(!!d.active);
  },

  health(d) {
    if (healthChart) healthChart.push(d.cpu, d.mem, d.ts);
  },

  error(d) {
    faultEl.textContent = d.message || 'Something went wrong.';
    faultEl.style.display = 'block';
    setTimeout(() => {
      faultEl.style.display = 'none';
    }, 6000);
  },
});

if (demo) {
  setInterval(() => {
    const s = avatar.stats();
    statusEl.textContent =
      `state ${avatar.state}  fps ${s.fps}  head ${s.headLoaded ? 'ok' : 'none'}  ` +
      `gaze ${avatar.gaze.x.toFixed(2)}  amp ${avatar.amplitude.toFixed(2)}`;
  }, 250);
}

// Boot beacon so operators can see JS executed.
try {
  fetch('./boot.txt?t=' + Date.now()).catch(() => {});
} catch (_) {}
</script>
</body>
</html>
