<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>COMSTAR</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #06080B;
    overflow: hidden;
    cursor: none !important;
    color: #E6EDF3;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  *, *::before, *::after { cursor: none !important; }
  .wrap {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    background:
      radial-gradient(ellipse 80% 55% at 50% 48%, rgba(61, 220, 255, 0.10), transparent 72%),
      #06080B;
  }
  .mark {
    width: min(42vw, 220px);
    height: min(42vw, 220px);
    aspect-ratio: 1;
  }
  .mark svg { width: 100%; height: 100%; display: block; }
  .word {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: #A8B6C4;
  }
  .status-row {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    gap: 12px;
    min-height: 1.4em;
    padding: 0 24px;
    max-width: min(92vw, 420px);
  }
  .spin {
    flex: 0 0 auto;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    border: 2px solid rgba(61, 220, 255, 0.18);
    border-top-color: #3DDCFF;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .status {
    flex: 1 1 auto;
    font: 400 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #6E7F90;
    text-align: left;
    min-width: 0;
  }
  .status.is-err { color: #FF5C5C; }
  .status-row.is-err .spin { display: none; }
  .retry {
    display: none;
    margin-top: 4px;
    font: 500 12px/1 system-ui, sans-serif;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #3DDCFF;
    background: transparent;
    border: 1px solid rgba(61, 220, 255, 0.35);
    border-radius: 6px;
    padding: 10px 16px;
    cursor: pointer !important;
  }
  .retry.show { display: inline-block; }
</style>
</head>
<body>
  <div class="wrap" id="wrap">
    <div class="mark" aria-hidden="true">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="COMSTAR">
        <defs>
          <radialGradient id="glow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#3DDCFF" stop-opacity="0.28"/>
            <stop offset="70%" stop-color="#3DDCFF" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <circle cx="32" cy="32" r="26" fill="url(#glow)"/>
        <g fill="none" stroke="#3DDCFF" stroke-linecap="round" stroke-linejoin="round">
          <path d="M32 6 L32 58" stroke-width="2.6"/>
          <path d="M6 32 L58 32" stroke-width="2.6"/>
          <path d="M12.5 12.5 L51.5 51.5" stroke-width="1.9" stroke-opacity="0.85"/>
          <path d="M51.5 12.5 L12.5 51.5" stroke-width="1.9" stroke-opacity="0.85"/>
          <path d="M32 14 L46 32 L32 50 L18 32 Z" stroke-width="2.2" fill="#3DDCFF" fill-opacity="0.16"/>
          <path d="M32 22 L40 32 L32 42 L24 32 Z" stroke-width="1.6"/>
        </g>
        <circle cx="32" cy="32" r="4.2" fill="#F0A202"/>
        <circle cx="32" cy="32" r="1.6" fill="#FFE6A8"/>
      </svg>
    </div>
    <div class="word">COMSTAR</div>
    <div class="status-row" id="statusRow">
      <div class="spin" id="spin" aria-hidden="true"></div>
      <div class="status" id="status">Starting…</div>
    </div>
    <button type="button" class="retry" id="retry">Retry</button>
  </div>
<script>
(function () {
  const DEFAULT_TARGET = 'http://127.0.0.1:8776/kiosk/?bloom=3&fps=12';
  const BOOT = 'http://127.0.0.1:8776/kiosk/boot.txt';
  const READY = 'http://127.0.0.1:8776/kiosk/ready.json';
  const BRIDGE_SPLASH = 'http://127.0.0.1:8776/kiosk/splash.html';
  const params = new URLSearchParams(location.search);
  // HDMI sink can take ~2 min after boot (prefer-hdmi fail → health heal).
  const timeoutMs = Number(params.get('timeout_ms') || 180000);
  const statusEl = document.getElementById('status');
  const statusRowEl = document.getElementById('statusRow');
  const spinEl = document.getElementById('spin');
  const retryEl = document.getElementById('retry');
  let stopped = false;
  let started = performance.now();
  let lastStatus = '';

  function sanitizeTarget(raw) {
    try {
      const u = new URL(String(raw || ''), 'http://127.0.0.1');
      if (u.protocol !== 'http:' && u.protocol !== 'https:') return DEFAULT_TARGET;
      if (u.hostname !== '127.0.0.1' && u.hostname !== 'localhost') return DEFAULT_TARGET;
      if (u.port !== '8776') return DEFAULT_TARGET;
      if (!u.pathname.startsWith('/kiosk')) return DEFAULT_TARGET;
      u.username = '';
      u.password = '';
      u.hash = '';
      return u.toString();
    } catch (_) {
      return DEFAULT_TARGET;
    }
  }

  const target = sanitizeTarget(params.get('target') || DEFAULT_TARGET);
  const onBridgeOrigin = location.port === '8776' && location.pathname.indexOf('/kiosk/') === 0;

  function setStatus(msg, err) {
    const next = String(msg || '');
    const isErr = !!err;
    if (next === lastStatus && statusEl.classList.contains('is-err') === isErr) {
      return;
    }
    lastStatus = next;
    statusEl.textContent = next;
    statusEl.classList.toggle('is-err', isErr);
    statusRowEl.classList.toggle('is-err', isErr);
  }

  function showRetry() {
    spinEl.style.display = 'none';
    retryEl.classList.add('show');
  }

  async function ping(url) {
    try {
      await fetch(url, { cache: 'no-store', mode: 'no-cors', method: 'GET' });
      return true;
    } catch (_) {
      return false;
    }
  }

  async function fetchReady() {
    try {
      const r = await fetch(READY, { cache: 'no-store', mode: 'cors' });
      if (!r.ok) return null;
      return await r.json();
    } catch (_) {
      return null;
    }
  }

  async function go() {
    if (stopped) return;

    // Phase 1: wait for bridge HTTP (works cross-origin via no-cors).
    if (!onBridgeOrigin) {
      setStatus('Waiting for bridge…');
      if (!(await ping(BOOT))) {
        if (performance.now() - started >= timeoutMs) {
          setStatus('Bridge did not start. Check comstar-bridge.', true);
          showRetry();
          return;
        }
        setTimeout(go, 500);
        return;
      }
      // Hop to same-origin splash so ready.json is readable (avoids PNA).
      const q = new URLSearchParams();
      q.set('target', target);
      q.set('timeout_ms', String(Math.max(5000, timeoutMs - (performance.now() - started))));
      location.replace(BRIDGE_SPLASH + '?' + q.toString());
      return;
    }

    // Phase 2 (same-origin): hold until speaker sink is ready.
    // Only update the label when the bridge reports a new status — avoid
    // Checking ↔ Waiting flicker between polls.
    const ready = await fetchReady();
    if (ready && ready.ok) {
      setStatus('Loading avatar…');
      location.replace(target);
      return;
    }
    if (ready && typeof ready.status === 'string' && ready.status && ready.status !== 'ready') {
      setStatus(ready.status);
    } else if (!lastStatus || lastStatus === 'Starting…') {
      setStatus('Waiting for systems…');
    }

    if (performance.now() - started >= timeoutMs) {
      setStatus('Systems not ready. Check HDMI audio / comstar-bridge.', true);
      showRetry();
      return;
    }
    setTimeout(go, 700);
  }

  retryEl.addEventListener('click', () => {
    stopped = false;
    started = performance.now();
    lastStatus = '';
    retryEl.classList.remove('show');
    statusRowEl.classList.remove('is-err');
    spinEl.style.display = '';
    setStatus('Retrying…');
    go();
  });

  go();
})();
</script>
</body>
</html>
