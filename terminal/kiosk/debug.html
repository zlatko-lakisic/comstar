<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>COMSTAR avatar — debug</title>
<style>
  html,body{margin:0;height:100%;background:#0a1018;color:#cfe6ff;
            font:14px/1.5 system-ui,-apple-system,sans-serif}
  .wrap{display:grid;grid-template-columns:1fr 280px;height:100vh}
  #stage{width:100%;height:100%}
  .panel{padding:20px;border-left:1px solid #1d2b3a;overflow:auto}
  h2{font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.08em;
     color:#5f88ad;margin:22px 0 8px}
  h2:first-child{margin-top:0}
  button{display:block;width:100%;margin-bottom:6px;padding:8px 10px;
         background:transparent;color:#cfe6ff;border:1px solid #23384c;
         border-radius:6px;font-size:13px;cursor:pointer}
  button:hover{background:#12202e}
  button.on{border-color:#5aa9e6;color:#9fd4ff}
  input[type=range]{width:100%}
  select{width:100%;padding:7px 8px;background:#0e1a26;color:#cfe6ff;
         border:1px solid #23384c;border-radius:6px;font-size:13px}
  label{display:flex;gap:8px;align-items:center;font-size:13px;margin-bottom:6px}
  .row{display:flex;justify-content:space-between;font-size:12px;color:#5f88ad;
       padding:3px 0;font-family:ui-monospace,Menlo,monospace}
</style>
</head>
<body>
<div class="wrap">
  <div id="stage"></div>
  <div class="panel">
    <h2>Emblem</h2>
    <select id="emblem"></select>
    <div class="row"><span>scale</span><span id="scv">0.62</span></div>
    <input type="range" id="sc" min="0.3" max="1.1" step="0.01" value="0.62">
    <div class="row"><span>bloom</span><span id="blv">0</span></div>
    <input type="range" id="bl" min="0" max="26" step="0.5" value="9">

    <h2>State</h2>
    <div id="states"></div>

    <h2>Gaze</h2>
    <input type="range" id="gx" min="-1" max="1" step="0.01" value="0">
    <div class="row"><span>x</span><span id="gxv">0.00</span></div>
    <label><input type="checkbox" id="sweep"> auto sweep</label>

    <h2>Mic level</h2>
    <input type="range" id="mic" min="0" max="1" step="0.01" value="0">
    <label><input type="checkbox" id="live"> live from microphone</label>

    <h2>Speech</h2>
    <button id="speak">Play test utterance</button>
    <button id="cancel">Cancel</button>
    <button id="think">Toggle thinking</button>

    <h2>Live</h2>
    <div class="row"><span>fps</span><span id="fps">—</span></div>
    <div class="row"><span>amplitude</span><span id="amp">—</span></div>
  </div>
</div>

<script type="module">
import { ComstarAvatar } from './avatar.js';
import { EMBLEM_NAMES } from './presets.js';

const stage = document.getElementById('stage');
const q = new URLSearchParams(location.search);
const opts = {
  emblem: q.get('emblem') || 'starburst',
  emblemScale: parseFloat(q.get('scale') || '0.62'),
  bloom: parseFloat(q.get('bloom') || '0'),
  onEvent: (type, data) => console.log('[avatar]', type, data),
};
let avatar = new ComstarAvatar(stage, opts);
const sc0 = document.getElementById('sc');
const bl0 = document.getElementById('bl');
if (sc0) { sc0.value = opts.emblemScale; document.getElementById('scv').textContent = String(opts.emblemScale); }
if (bl0) { bl0.value = opts.bloom; document.getElementById('blv').textContent = String(opts.bloom); }
const picker0 = document.getElementById('emblem');
if (picker0 && opts.emblem) picker0.value = opts.emblem;

const picker = document.getElementById('emblem');
EMBLEM_NAMES.forEach((n) => picker.add(new Option(n, n)));
function rebuild() {
  const keep = avatar.state;
  avatar.dispose();
  avatar = new ComstarAvatar(stage, opts);
  avatar.setState(keep);
}
picker.onchange = () => { opts.emblem = picker.value; rebuild(); };

// Scale is live: no rebuild needed, it is read every frame.
const sc = document.getElementById('sc');
sc.oninput = () => {
  opts.emblemScale = parseFloat(sc.value);
  avatar.emblemScale = opts.emblemScale;
  document.getElementById('scv').textContent = sc.value;
};
// Bloom lives in an SVG filter, so it does need a rebuild.
const bl = document.getElementById('bl');
bl.onchange = () => {
  opts.bloom = parseFloat(bl.value);
  document.getElementById('blv').textContent = bl.value;
  rebuild();
};


const STATES = ['ambient', 'sleeping', 'noticed', 'engaged', 'listening', 'responding'];
const host = document.getElementById('states');
function select(name) {
  avatar.setState(name);
  [...host.children].forEach((c) => c.classList.toggle('on', c.textContent === name));
}
STATES.forEach((s) => {
  const b = document.createElement('button');
  b.textContent = s;
  b.onclick = () => select(s);
  host.appendChild(b);
});
select('ambient');

const gx = document.getElementById('gx');
const sweep = document.getElementById('sweep');
gx.oninput = () => {
  avatar.setGaze(parseFloat(gx.value));
  document.getElementById('gxv').textContent = parseFloat(gx.value).toFixed(2);
};
setInterval(() => {
  if (!sweep.checked) return;
  const v = Math.sin(performance.now() / 2200);
  gx.value = v; gx.oninput();
}, 40);

const micSlider = document.getElementById('mic');
micSlider.oninput = (e) => avatar.setMicLevel(parseFloat(e.target.value));

// Optional: drive the listening meter from the real microphone, which is the
// fastest way to judge whether the meter's response curve feels right.
document.getElementById('live').onchange = async (e) => {
  if (!e.target.checked) return;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const ctx = new AudioContext();
    const an = ctx.createAnalyser();
    an.fftSize = 256;
    ctx.createMediaStreamSource(stream).connect(an);
    const bins = new Uint8Array(an.frequencyBinCount);
    setInterval(() => {
      if (!e.target.checked) return;
      an.getByteTimeDomainData(bins);
      let sum = 0;
      for (const b of bins) { const v = (b - 128) / 128; sum += v * v; }
      avatar.setMicLevel(Math.min(1, Math.sqrt(sum / bins.length) * 4));
    }, 33);
  } catch {
    e.target.checked = false;
    console.warn('microphone denied');
  }
};

/**
 * Synthesises a speech-like waveform so the amplitude path can be exercised
 * without Piper, the bridge, or a network. Amplitude-modulated noise tracks
 * real speech envelopes closely enough to tune the pulse against.
 */
function testUtteranceUrl(seconds = 4) {
  const rate = 22050;
  const n = rate * seconds;
  const buf = new ArrayBuffer(44 + n * 2);
  const view = new DataView(buf);
  const ascii = (off, s) => [...s].forEach((c, i) => view.setUint8(off + i, c.charCodeAt(0)));
  ascii(0, 'RIFF'); view.setUint32(4, 36 + n * 2, true); ascii(8, 'WAVEfmt ');
  view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
  view.setUint32(24, rate, true); view.setUint32(28, rate * 2, true);
  view.setUint16(32, 2, true); view.setUint16(34, 16, true);
  ascii(36, 'data'); view.setUint32(40, n * 2, true);
  for (let i = 0; i < n; i++) {
    const t = i / rate;
    const syllable = Math.max(0, Math.sin(t * 7.5)) ** 2;
    const phrase = t % 4 < 3.2 ? 1 : 0;
    const carrier = Math.sin(t * 2 * Math.PI * 160) * 0.6 + (Math.random() - 0.5) * 0.4;
    view.setInt16(44 + i * 2, carrier * syllable * phrase * 12000, true);
  }
  return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
}

document.getElementById('speak').onclick = () => {
  select('responding');
  avatar.speak(testUtteranceUrl());
};
document.getElementById('cancel').onclick = () => avatar.cancelSpeak();

let thinking = false;
document.getElementById('think').onclick = () => {
  thinking = !thinking;
  avatar.setThinking(thinking);
  document.getElementById('think').classList.toggle('on', thinking);
};

setInterval(() => {
  const s = avatar.stats();
  document.getElementById('fps').textContent = s.fps;
  document.getElementById('amp').textContent = avatar.amplitude.toFixed(2);
}, 200);
</script>
</body>
</html>
