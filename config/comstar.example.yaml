# COMSTAR configuration — copy to config/comstar.yaml and edit.
# Unknown keys cause a fatal startup error (typo protection).

orchestration:
  base_url: http://10.0.10.16:8765          # AO daemon WebSocket/HTTP base
  token: ""                                  # x-warpgate-token (set in real config, never commit)
  ttl_seconds: 86400                         # overlay TTL (AO max); refresh before expiry
  timeout_seconds: 15                        # 5–60 per CONTRACTS §7
  overlay_root: ./overlays/comstar

vision:
  codeproject_url: http://10.0.10.16:32168
  detection_endpoint: /v1/vision/detection
  recognize_endpoint: /v1/vision/face/recognize
  ambient_fps: 1                             # 0.2–5
  engaged_fps: 3                             # ambient_fps–10
  person_confidence: 0.60                    # 0.3–0.95
  face_confidence: 0.40                      # 0.3–0.95
  recognize_votes: 2                         # 1–10 consecutive matches
  identity_ttl_seconds: 600

audio:
  wakeword_model: ./models/hey_comstar.onnx
  wakeword_threshold: 0.55                   # 0.2–0.95
  vad_silence_ms: 700                        # 300–2000
  max_utterance_seconds: 15
  followup_window_seconds: 25                # 0–30
  duplex: half                               # half | full

avatar:
  render: local                              # local | streamed
  model: ./assets/comstar.glb
  tts: piper
  piper_voice: en_US-ryan-high               # or absolute path to .onnx on the Pi
                                             # e.g. /opt/comstar/models/en_US-lessac-medium.onnx

attention:
  face_attention_trigger: true
  stranger_mode: greet                         # restricted | greet | ignore — greet = guest session for unknowns
  timezone: America/New_York                   # optional spoken label; clock uses Pi system TZ
  idle_sleep_seconds: 600                      # 0 disables; silent auto-sleep after idle
  working_ack_ms: 4500                         # 0 disables; "working on it" only for slow tool/query turns
  working_ack_on_tools: true                   # also require mcpProvidersForVoice non-empty; never for chit-chat

# AO phrase banks — periodic short lines for engage / sleep / social.
# Text only; TTS runs at speak time. Optional [[name]] slots filled with display name.
phrases:
  enabled: true
  refresh_hours: 6                            # 1–168
  bank_size: 8                                 # 3–24 lines per category

# Rolling conversation memory (per recognized userid). Guests get none.
# Prefer url (shared HTTP) so multiple hallway terminals share one history.
# Env overrides: COMSTAR_MEMORY_URL, COMSTAR_MEMORY_DIR, COMSTAR_TERMINAL_ID.
memory:
  enabled: true
  max_turns: 20                                # 2–100
  max_inject_chars: 3500                       # 500–12000
  store_dir: ""                                # default ~/.local/share/comstar/conversation
  url: "http://127.0.0.1:8792"                 # scripts/comstar_memory_server.py
  durable: true                                # Phase 2 prefs / remember-that facts
  max_facts_inject: 8                          # 1–32
  max_facts_chars: 1200                        # 200–4000

# House-wide presence via HA person.* (ADR 0006). Does not drive attention FSM.
# IPA group / comstarHaPerson overlay is P2.3+; yaml remains the override.
presence:
  ha_person_by_uid:
    zlatko: person.zlatko_lakisic

# FreeIPA directory resolve (ADR 0005). When enabled=false, faceId == session uid.
directory:
  enabled: false
  sidecar_url: ""                              # e.g. http://10.0.10.16:8780
  require: true                                # miss/error → FaceUnknown / guest
  cache_ttl_seconds: 600                       # 60–3600
  timeout_ms: 1500                             # 200–10000

# Dev-mode LAN binding for kiosk/audio WebSockets — production must keep
# bind_lan: false (triple-gate: COMSTAR_ENV=dev + comstar.dev.yaml + token).
dev:
  bind_lan: false
  lan_token: ""

# Admin console (:8781/admin). Can bind LAN independently of WS triple-gate.
# Prefer COMSTAR_ADMIN_BIND_LAN=1 + COMSTAR_ADMIN_TOKEN in systemd (never commit).
admin:
  bind_lan: false
  token: ""
