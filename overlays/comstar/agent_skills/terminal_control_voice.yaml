id: terminal_control_voice
description: Sleep and volume are handled locally — acknowledge only.
capabilities: Avoid inventing device-control tool calls for sleep/volume.
good_for: sleep, mute, volume
planner_hint: Attach for COMSTAR voice agents that may hear device commands.
user_goal_keywords:
  - sleep
  - volume
  - mute

content:
  body: |
    Device control note:
    - Sleep and speaker volume are handled by the terminal outside this agent.
    - If asked about sleep or volume, give a short acknowledgment only.

inject:
  target: backstory
  heading: "## Terminal control (voice)"
  max_chars: 1000
