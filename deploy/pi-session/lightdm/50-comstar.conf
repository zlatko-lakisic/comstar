# Drop-in for /etc/lightdm/lightdm.conf.d/50-comstar.conf
# Use the COMSTAR session (labwc without --merge-config) so Pi desktop chrome
# never starts.

[Seat:*]
autologin-user=md-admin
autologin-user-timeout=0
autologin-session=comstar-labwc
user-session=comstar-labwc
greeter-hide-users=true
greeter-session=pi-greeter
