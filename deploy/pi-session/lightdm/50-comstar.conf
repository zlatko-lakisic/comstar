# Drop-in snippet for /etc/lightdm/lightdm.conf.d/50-comstar.conf
# Installed by scripts/install-pi-session.sh (requires sudo).
# Keep the Pi OS labwc session (LXDE-pi-labwc); panels are killed via autostart.

[Seat:*]
autologin-user=md-admin
autologin-user-timeout=0
autologin-session=LXDE-pi-labwc
user-session=LXDE-pi-labwc
greeter-hide-users=true
