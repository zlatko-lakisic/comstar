# COMSTAR text channel (Ada) — example config
#
# Native ChannelMux (ADR 0015):
#   Telegram Bot API | WhatsApp Cloud API | signal-cli JSON-RPC
# Pairing: voice “link Telegram/WhatsApp/Signal” → kiosk pairing.qr
#
# Copy to a private path (never commit real tokens). Prefer env for secrets.

ao:
  base_url: https://127.0.0.1:8765
  # COMSTAR_AO_MTLS=1 + COMSTAR_AO_MTLS_DIR

overlay_root: /opt/comstar/src/overlays/comstar

telegram:
  # TELEGRAM_BOT_TOKEN=
  # TELEGRAM_BOT_USERNAME=  # optional; else getMe

whatsapp:
  # Meta Cloud API (official only — no Baileys)
  # COMSTAR_WHATSAPP_CLOUD_TOKEN=
  # COMSTAR_WHATSAPP_PHONE_NUMBER_ID=
  # COMSTAR_WHATSAPP_VERIFY_TOKEN=
  # COMSTAR_WHATSAPP_DISPLAY_PHONE=15551234567   # digits for wa.me QR
  # Webhook: https://<ada-public-or-tunnel>:8782/v1/whatsapp/webhook

signal:
  # signal-cli -a +15551234567 daemon --http 127.0.0.1:8080
  # COMSTAR_SIGNAL_URL=http://127.0.0.1:8080
  # COMSTAR_SIGNAL_ACCOUNT=+15551234567

# Optional static seed (Telegram ids or provider:sender). Prefer QR pairing.
allowlist:
  "123456789": zlatko

rate_limit:
  per_sender_max: 20
  per_sender_window_minutes: 10
  daily_cap: 200

session:
  idle_ttl_hours: 6

# COMSTAR_CHANNEL_BIND=0.0.0.0
# COMSTAR_CHANNEL_PORT=8782
# COMSTAR_CHANNEL_TOKEN=...
